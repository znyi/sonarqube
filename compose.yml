services:
  db:
    image: postgres:18
    container_name: sonarqube_db
    env_file: "db.env"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonar}
      POSTGRES_DB: ${POSTGRES_DB:-sonarqube}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonar}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  sonar:
    image: sonarqube:26.5.0.122743-community
    container_name: sonarqube_server
    depends_on:
      db:
        condition: service_healthy
    env_file: "sonarqube.env"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sonarqube}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-sonar}
      SONAR_WEB_SYSTEMPASSCODE: ${SONAR_WEB_SYSTEMPASSCODE:-sonar}
#      SONAR_AUTH_JWTBASE64HS256SECRET: ${SONAR_AUTH_JWTBASE64HS256SECRET:?jwt-secret-unset} # Uncomment and define SONAR_AUTH_JWTBASE64HS256SECRET if persistent session is needed
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    healthcheck:
      test: [ "CMD-SHELL", "curl -X GET http://localhost:9000/api/system/health -H X-Sonar-Passcode:$SONAR_WEB_SYSTEMPASSCODE" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  nginx:
    image: nginx
    container_name: sonarqube_nginx
    depends_on:
      sonar:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
